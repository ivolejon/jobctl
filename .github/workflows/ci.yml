name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt found unformatted files:"
            echo "$files"
            exit 1
          fi
      - name: Lint launchd plists
        if: runner.os == 'macOS'
        run: plutil -lint internal/schedule/testdata/*.plist
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Cross-build release targets
        if: runner.os == 'Linux'
        run: |
          GOOS=linux  GOARCH=amd64 go build -o /tmp/jobctl-linux        ./cmd/jobctl
          GOOS=linux  GOARCH=arm64 go build -o /tmp/jobctl-linux-arm64  ./cmd/jobctl
          GOOS=darwin GOARCH=amd64 go build -o /tmp/jobctl-darwin       ./cmd/jobctl
          GOOS=darwin GOARCH=arm64 go build -o /tmp/jobctl-darwin-arm64 ./cmd/jobctl
